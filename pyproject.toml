[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labbioagentos"
version = "0.1.0"
description = "Governed bioinformatics multi-agent system with a LabBio-owned Native Kernel"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.12,<0.13",
    "h5py>=3.10,<4",
    "httpx>=0.27,<1",
    "packaging>=24,<27",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
labbio = "labbioagentos.cli:entrypoint"

[project.optional-dependencies]
test = [
    "jsonschema>=4,<5",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labbioagentos = ["resources/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
