[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labbioagentos"
version = "0.1.0"
description = "Architecture-first bioinformatics agent system extending PantheonOS"
requires-python = ">=3.11"
dependencies = [
    "pantheon-agents>=0.6.4,<0.7",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

